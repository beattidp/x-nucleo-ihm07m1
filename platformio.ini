[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube

; Build settings to include code structure definitions
build_flags = 
    -I include
    -D STM32G474xx
    -Wl,-u,_printf_float

board_build.stm32cube.custom_config_header = yes

; Upload & Debug configuration for onboard ST-Link (STLINK-V3E)
upload_protocol = stlink
upload_flags =
    -c
    reset_config none
debug_tool = stlink
debug_server =
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/bin/openocd
    -s
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/openocd/scripts
    -f
    board/st_nucleo_g4.cfg
    -c
    reset_config none

; Serial monitor configuration (LPUART1 on PA2/PA3 @ 115200 baud)
monitor_speed = 115200
